<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrevTech 1.0 - Sistema RPPS</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/icon-prevtech-192.png">

  <!-- CSS principal -->
  <link rel="stylesheet" href="style.css">

  <!-- Scripts externos do Google -->
  <script async defer src="https://apis.google.com/js/api.js"></script>
  <script async defer src="https://accounts.google.com/gsi/client"></script>
</head>
<body>

  <!-- ============================== -->
  <!-- TELA DE LOGIN -->
  <!-- ============================== -->
  <div id="telaLogin" style="display: flex;">
    <div class="login-container">
      <div class="login-branding">
        <h2>PREVTECH</h2>
        <p>Sistema de Gestão Previdenciária</p>
      </div>
      <div class="login-form">
        <img src="img/icon-prevtech-192.png" alt="Logo PrevTech" class="login-logo">
        <h2>Bem-vindo</h2>
        <p>Faça login com sua conta autorizada</p>
        <button class="primary google-login-btn" onclick="auth.loginGoogle()">
          <i class="ri-google-fill"></i> Entrar com Google
        </button>
        <div id="mensagem"></div>
      </div>
    </div>
  </div>

  <!-- ============================== -->
  <!-- CONTEÚDO PRINCIPAL (APP) -->
  <!-- ============================== -->
  <div class="app-container" style="display: none;">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>PrevTech</h2>
      </div>
      <div class="sidebar-profile">
        <div class="sidebar-profile-avatar" id="user-avatar">U</div>
        <div class="profile-info">
          <span id="usuarioLogadoSidebar">Usuário</span>
          <small id="usuarioTipoSidebar">Perfil</small>
        </div>
      </div>
      <ul class="sidebar-nav" id="main-nav">
        <li><a href="#" onclick="handleNavClick(event, 'dashboard')"><i class="ri-dashboard-line"></i> Dashboard</a></li>
        <li><a href="#" onclick="handleNavClick(event, 'simulacao')"><i class="ri-calculator-line"></i> Simulação</a></li>
        <li><a href="#" onclick="handleNavClick(event, 'geradorCTC')"><i class="ri-file-list-2-line"></i> CTC</a></li>
        <li id="admin-nav-item" style="display:none;"><a href="#" onclick="handleNavClick(event, 'telaUsuarios')"><i class="ri-user-settings-line"></i> Usuários</a></li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- Topbar -->
      <div class="topbar">
        <div class="datetime-container" id="datetime-container"></div>
        <div class="topbar-right">
          <div class="user-info"><b id="usuarioLogado">Usuário</b></div>
          <button onclick="auth.logout()"><i class="ri-logout-box-r-line"></i></button>
          <button id="toggleTheme" onclick="alternarTema()"><i class="ri-moon-line"></i></button>
        </div>
      </div>

      <!-- Conteúdo das páginas -->
      <div class="page-content">
        <div id="dashboard" class="content-wrapper">📊 Bem-vindo ao Dashboard</div>
        <div id="simulacao" class="content-wrapper" style="display:none;">
          <h2>Simulação</h2>
          <input type="text" id="nomeSimulacao" placeholder="Nome da Simulação">
          <button id="btnSaveToDrive" class="primary" onclick="drive.handleSaveSimulationClick()" disabled>💾 Salvar no Google Drive</button>
        </div>
        <div id="geradorCTC" class="content-wrapper" style="display:none;">
          <h2>Gerador de CTC</h2>
        </div>
        <div id="telaUsuarios" class="content-wrapper" style="display:none;">
          <h2>Gestão de Usuários</h2>
        </div>
      </div>

      <!-- Rodapé -->
      <footer>PrevTech © 2025 - Sistema de Gestão Previdenciária</footer>
    </main>
  </div>

  <!-- JS principal -->
  <script type="module" src="script.js"></script>
  
  <!-- Ícones (Remixicon) -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
</body>
</html>
